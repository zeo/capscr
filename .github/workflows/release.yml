name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # bypass the runner's machine-level sccache wrapper, whose server drops
  # connections mid-build; Swatinem/rust-cache still caches deps between runs
  RUSTC_WRAPPER: ""

jobs:
  build-windows:
    if: github.actor == 'zeo'
    runs-on: [self-hosted, windows-vm]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ROT_INSTALLER_REPOSITORY }}
          path: .rot-installer
          ssh-key: ${{ secrets.ROT_INSTALLER_DEPLOY_KEY }}
          persist-credentials: false

      - name: Extract changelog for tag
        id: changelog
        shell: powershell
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME -replace '^v', ''
          $pattern = '^##\s+\[' + [regex]::Escape($version) + '\]'
          $lines = Get-Content -LiteralPath 'CHANGELOG.md'
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match $pattern) { $start = $i; break }
          }
          $collected = New-Object System.Collections.Generic.List[string]
          if ($start -ge 0) {
            for ($j = $start + 1; $j -lt $lines.Count; $j++) {
              if ($lines[$j] -match '^##\s+\[') { break }
              $collected.Add($lines[$j])
            }
          }
          $body = ($collected -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($body)) { $body = "capscr $version" }
          $delim = 'CHANGELOG_EOF_' + [System.Guid]::NewGuid().ToString('N')
          $payload = "notes<<$delim`n$body`n$delim`n"
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $payload, (New-Object System.Text.UTF8Encoding $false))

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build bridge installer
        shell: powershell
        env:
          TERMIE_INSTALLER_PUBLIC_KEY: ${{ vars.TERMIE_INSTALLER_PUBLIC_KEY }}
          CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          cargo build --release --locked --manifest-path .rot-installer\Cargo.toml --bin rot-installer --bin rot-pack
          if ($LASTEXITCODE -ne 0) { throw "shared installer build failed" }
          New-Item -ItemType Directory -Force bridge | Out-Null
          $installer = 'bridge\rot-installer.exe'
          Copy-Item '.rot-installer\target\release\rot-installer.exe' $installer
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool is unavailable" }
          if ([string]::IsNullOrWhiteSpace($env:CERTIFICATE_THUMBPRINT)) { throw "certificate thumbprint is unavailable" }
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          & $signtool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT /fd sha256 /tr $timestamp /td sha256 $installer
          if ($LASTEXITCODE -ne 0) { throw "installer signing failed" }

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'capscr ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --config tauri.bridge.conf.json

      # the branded first-install experience: a native window wrapped around the
      # very MSI tauri just built (and signed), so the in-app updater's chain is
      # untouched. signed with the same cert, attached beside the MSI
      - name: Build capscr-setup (native installer)
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ver = $env:TAG_NAME -replace '^v',''
          $msi = Get-ChildItem target\release\bundle\msi\*.msi | Select-Object -First 1
          if (-not $msi) { throw "no MSI found under target\release\bundle\msi" }
          $env:CAPSCR_MSI_PATH = $msi.FullName
          $env:CAPSCR_APP_VERSION = $ver
          cargo build --release --manifest-path setup/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "setup build failed" }
          $out = "capscr-$ver-setup.exe"
          Copy-Item setup\target\release\capscr-setup.exe $out
          # sign with the machine cert tauri already uses; warn-only if signtool
          # is missing so the release still completes
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($signtool) {
            & $signtool.FullName sign /sha1 6EC3EDE3956F6F4B7423C723397AF66BC9D596BA /fd sha256 /tr http://timestamp.digicert.com /td sha256 $out
            if ($LASTEXITCODE -ne 0) { Write-Warning "signing failed; uploading unsigned" }
          } else {
            Write-Warning "signtool not found; uploading unsigned"
          }
          # gh isn't on this self-hosted runner's PATH; upload the installer to
          # the release tauri-action already created, via the REST API with the
          # workflow token. clobber any prior asset of the same name.
          $name = Split-Path $out -Leaf
          $repo = $env:GITHUB_REPOSITORY
          $headers = @{
            Authorization          = "Bearer $env:GITHUB_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $rel = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/$repo/releases/tags/$env:TAG_NAME"
          foreach ($asset in @($rel.assets | Where-Object { $_.name -eq $name })) {
            Invoke-RestMethod -Method Delete -Headers $headers "https://api.github.com/repos/$repo/releases/assets/$($asset.id)"
          }
          $uploadUrl = ($rel.upload_url -replace '\{.*\}$', '') + "?name=$name"
          $uploadHeaders = $headers.Clone()
          $uploadHeaders["Content-Type"] = "application/octet-stream"
          Invoke-RestMethod -Method Post -Headers $uploadHeaders -InFile $out $uploadUrl | Out-Null

      - name: Pack shared installer release
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_CERTIFICATE_THUMBPRINT }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v',''
          $stage = Join-Path $env:RUNNER_TEMP 'capscr-rpack'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\capscr.exe $stage\
          $pack = '.rot-installer\target\release\rot-pack.exe'
          $installer = '.rot-installer\target\release\rot-installer.exe'
          function Invoke-RotPack {
            & $pack @args
            if ($LASTEXITCODE -ne 0) { throw "rot-pack failed with exit code $LASTEXITCODE" }
          }
          function Invoke-TauriSign([string]$path, [string]$output) {
            $resolved = (Resolve-Path -LiteralPath $path).Path
            pnpm --dir frontend exec tauri signer sign $resolved
            if ($LASTEXITCODE -ne 0) { throw "tauri signer failed with exit code $LASTEXITCODE" }
            Copy-Item "$resolved.sig" $output
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          $package = "dist\capscr-$ver-windows-x86_64.rpack"
          Invoke-RotPack pack $stage $package --app capscr --version $ver
          Invoke-TauriSign $package "$package.minisig"
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$(Split-Path $package -Leaf)"
          Invoke-RotPack manifest $package dist\installer.json --url $url --signature "$package.minisig" --published-at ([DateTime]::UtcNow.ToString('o')) --target windows-x86_64
          Invoke-TauriSign dist\installer.json dist\installer.json.minisig
          Invoke-RotPack online $installer "dist\capscr-$ver-online-setup.exe"
          Invoke-RotPack offline $installer $package "$package.minisig" "dist\capscr-$ver-offline-setup.exe" --app capscr
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $timestamp = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          foreach ($file in @("dist\capscr-$ver-online-setup.exe", "dist\capscr-$ver-offline-setup.exe")) {
            & $signtool.FullName sign /sha1 $env:CERTIFICATE_THUMBPRINT /fd sha256 /tr $timestamp /td sha256 $file
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $file" }
          }

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/capscr-*.rpack
            dist/capscr-*.rpack.minisig
            dist/capscr-*-online-setup.exe
            dist/capscr-*-offline-setup.exe
            dist/installer.json
            dist/installer.json.minisig
          fail_on_unmatched_files: true

  # linux bundles (deb / rpm / AppImage) on a hosted runner. ubuntu-24.04 is
  # the oldest image whose pipewire headers libspa 0.9 compiles against, which
  # puts the AppImage glibc floor at 2.39 (Ubuntu 24.04 / Debian 13 / Fedora 40
  # or newer). runs after the windows job so the two tauri-action invocations
  # update the release (and merge latest.json) sequentially instead of racing
  # to create it.
  build-linux:
    if: github.actor == 'zeo'
    needs: build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.ROT_INSTALLER_REPOSITORY }}
          path: .rot-installer
          ssh-key: ${{ secrets.ROT_INSTALLER_DEPLOY_KEY }}
          persist-credentials: false

      - name: Extract changelog for tag
        id: changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          body="$(awk -v ver="$version" '
            $0 ~ "^##[[:space:]]+\\[" ver "\\]" { found=1; next }
            found && /^##[[:space:]]+\[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf %s "$body" | tr -d '[:space:]')" ]; then body="capscr $version"; fi
          delim="CHANGELOG_EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "notes<<$delim"; printf '%s\n' "$body"; echo "$delim"; } >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libclang-dev libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev \
            libxrandr-dev libdbus-1-dev libpipewire-0.3-dev \
            libwayland-dev libegl-dev libgbm-dev libdrm-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: frontend
        run: npm install

      - name: Build and release with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'capscr ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.notes }}
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true

      - name: Build shared installer tools
        env:
          TERMIE_INSTALLER_PUBLIC_KEY: ${{ vars.TERMIE_INSTALLER_PUBLIC_KEY }}
        run: cargo build --release --locked --manifest-path .rot-installer/Cargo.toml --bin rot-installer --bin rot-pack

      - name: Pack shared installer release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          stage="$RUNNER_TEMP/capscr-rpack"
          mkdir -p "$stage" dist
          install -m755 "$appimage" "$stage/capscr"
          pack=.rot-installer/target/release/rot-pack
          installer=.rot-installer/target/release/rot-installer
          package="dist/capscr-$ver-linux-x86_64.rpack"
          "$pack" pack "$stage" "$package" --app capscr --version "$ver"
          package_path="$(realpath "$package")"
          pnpm --dir frontend exec tauri signer sign "$package_path"
          cp "$package_path.sig" "$package.minisig"
          curl --proto '=https' --tlsv1.2 --retry 5 --location --fail \
            -o dist/installer.json \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/installer.json"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$package")"
          "$pack" manifest "$package" dist/installer.json --url "$url" --signature "$package.minisig" --published-at "$(date --utc --iso-8601=seconds)" --target linux-x86_64
          manifest_path="$(realpath dist/installer.json)"
          pnpm --dir frontend exec tauri signer sign "$manifest_path"
          cp "$manifest_path.sig" dist/installer.json.minisig
          "$pack" online "$installer" "dist/capscr-$ver-linux-x86_64-setup"
          "$pack" offline "$installer" "$package" "$package.minisig" "dist/capscr-$ver-linux-x86_64-offline-setup" --app capscr
          chmod 755 dist/capscr-*-setup

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            dist/capscr-*.rpack
            dist/capscr-*.rpack.minisig
            dist/capscr-*-setup
            dist/installer.json
            dist/installer.json.minisig
          overwrite_files: true
          fail_on_unmatched_files: true
