# cargo-audit configuration
# every advisory ignored here has a rationale explaining why it does not apply
# to capscr's threat model; re-evaluate when a dep ships a fix or usage changes

[advisories]
ignore = [
    # paste / proc-macro-error are build-time proc macros with no runtime exposure
    "RUSTSEC-2024-0436", # paste unmaintained
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained
]
